name: Main CI and releases

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  eligible:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        run: node scripts/release.mjs check "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD)"

  publish:
    needs: eligible
    if: needs.eligible.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.0 --ignore-scripts --no-audit --no-fund
      - name: Download only this successful main CI run's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: npm-*
          merge-multiple: false
          path: .artifacts
      - name: Publish validated tarballs and create package releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish

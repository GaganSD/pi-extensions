name: pi-web-search

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            node: "22.19.0"
            pi: "0.99.0"
          - name: Windows
            os: windows-latest
            node: "24.x"
            pi: "0.99.0"
          - name: macOS
            os: macos-latest
            node: "24.x"
            pi: "1.0.0"
    defaults:
      run:
        working-directory: package validation workspace/pi-web-search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package validation workspace
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package validation workspace/pi-web-search/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      # npm 12 avoids Pi 1.0's vulnerable shrinkwrapped brace-expansion version.
      - name: Install Pi 1.0
        if: matrix.pi == '1.0.0'
        run: npx --yes npm@12.0.0 install --ignore-scripts --no-audit --no-fund --save-dev @earendil-works/pi-coding-agent@1.0.0 @earendil-works/pi-ai@1.0.0 @earendil-works/pi-tui@1.0.0
      - name: Audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      # pack:check runs all runtime tests against the tarball. Do not run them twice.
      - name: Test package and runtime
        run: npm test -- tests/package && npm run pack:check

name: pi-web-search

on:
  pull_request:
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  push:
    branches: [main]
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.19.0", "24.x"]
        pi: ["0.99.0"]
        include:
          - os: ubuntu-latest
            node: "24.x"
            pi: "1.0.0"
    defaults:
      run:
        working-directory: package validation workspace/pi-web-search
    steps:
      - uses: actions/checkout@v4
        with:
          path: package validation workspace
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package validation workspace/pi-web-search/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # npm 11 preserves Pi 1.0's vulnerable shrinkwrap (brace-expansion 5.0.9).
      # npm 12 resolves the patched transitive version. Keep the full audit gate.
      - name: Use npm 12 for the compatibility host
        if: matrix.pi != '0.99.0'
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@12.0.0
      - name: Install compatibility host
        if: matrix.pi != '0.99.0'
        run: npm install --ignore-scripts --no-audit --no-fund --save-dev @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      - name: Audit production and locked development dependencies
        run: npm audit --audit-level=high
      - name: Offline regression tests (isolated config and credentials)
        run: npm test
      - name: Typecheck source, tests, and validation scripts
        run: npm run typecheck
      - name: Validate and install tarball, load Pi entrypoint, and test extracted source offline
        run: npm run pack:check

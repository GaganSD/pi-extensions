name: pi-web-search

on:
  pull_request:
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  push:
    branches: [main]
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: package validation workspace/pi-web-search
    steps:
      - uses: actions/checkout@v4
        with:
          path: package validation workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package validation workspace/pi-web-search/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Offline regression tests (isolated config and credentials)
        run: npm test
      - name: Typecheck source, tests, and validation scripts
        run: npm run typecheck
      - name: Validate and install tarball, load Pi entrypoint, and test extracted source offline
        run: npm run pack:check

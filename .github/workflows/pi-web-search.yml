name: pi-web-search

on:
  pull_request:
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  push:
    branches: [main]
    paths:
      - "pi-web-search/**"
      - ".github/workflows/pi-web-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]
    defaults:
      run:
        working-directory: pi-web-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pi-web-search/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline regression tests (isolated config and credentials)
        run: npm test
      - name: Typecheck source, tests, and validation scripts
        run: npm run typecheck
      - name: Validate and install tarball, load Pi entrypoint, and test extracted source offline
        run: npm run pack:check

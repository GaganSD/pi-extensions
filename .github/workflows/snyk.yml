name: Snyk Open Source

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: "Pi package directory name (e.g. pi-slate)"
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
        description: "Pi package directory name (e.g. pi-slate)"

permissions:
  contents: read

concurrency:
  group: snyk-${{ inputs.package }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Snyk / ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Snyk publishes the actions as container-action references on @master;
      # pin to the current commit SHA when bumping. See
      # https://github.com/snyk/actions#how-to-use-snyk-actions
      - uses: snyk/actions/setup@master
      - name: Snyk test (production dependencies)
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --dev=false
          command: test
          working-directory: ${{ inputs.package }}
      - name: Snyk test (development dependencies)
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --dev=true
          command: test
          working-directory: ${{ inputs.package }}
      - name: Snyk monitor (snapshot the package for ongoing advisories)
        if: success()
        uses: snyk/actions/node@master
        with:
          command: monitor
          working-directory: ${{ inputs.package }}
        continue-on-error: true
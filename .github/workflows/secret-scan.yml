name: Secret scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Prove the scanner rejects a synthetic credential
        env:
          REQUIRE_GITLEAKS: "1"
        run: node --test scripts/secret-scan.test.mjs
      - name: Scan repository history (redacted, offline)
        run: bash scripts/secret-scan.sh history

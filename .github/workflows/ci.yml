name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_packages: ${{ steps.detect.outputs.has_packages }}
      matrix: ${{ steps.detect.outputs.matrix }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          fi
      - id: detect
        env:
          BASE: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.sha || '' }}
        run: node scripts/ci.mjs "$BASE" "$GITHUB_SHA"

  tooling:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint tooling
        run: npm exec -- eslint scripts eslint.config.mjs --max-warnings=0
      - name: Tooling regression tests
        run: npm run test:tooling
      - name: Audit tooling dependencies
        run: npm audit --audit-level=high
      - name: Validate release intent
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: npm run release:check -- "$BASE" "$GITHUB_SHA"

  packages:
    needs: changes
    if: needs.changes.outputs.has_packages == 'true'
    name: Package / ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # One combined lane per package: current Node and Pi, on Linux.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.package }}/package-lock.json
      - run: npm install --global npm@12.0.0 snyk@1.1307.4 --ignore-scripts --no-audit --no-fund
      - name: Install tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install package
        run: npm ci --prefix "${{ matrix.package }}" --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint --prefix "${{ matrix.package }}"
      - name: Typecheck
        run: npm run typecheck --prefix "${{ matrix.package }}"
      - name: Unit tests
        run: npm run test:unit --prefix "${{ matrix.package }}"
      - name: Integration tests
        run: npm run test:integration --prefix "${{ matrix.package }}"
      # Snyk is the single dependency gate: one scan covers production and
      # development dependencies. Skipped on fork PRs, where GitHub withholds
      # secrets.
      # Exit 1 means advisories (fail); exit 2 is a retryable API error, so
      # retry five times before letting a Snyk outage fail the build.
      - if: env.SNYK_TOKEN != ''
        name: Snyk dependency scan (production and development)
        working-directory: ${{ matrix.package }}
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            snyk test --severity-threshold=high --dev
            status=$?
            if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then exit "$status"; fi
            echo "Snyk transient failure (exit $status); retry $attempt/5"
            sleep 20
          done
          exit "$status"
      - if: env.SNYK_TOKEN != '' && github.event_name == 'push'
        name: Snyk monitor on main (best effort)
        working-directory: ${{ matrix.package }}
        run: snyk monitor --dev
        continue-on-error: true
      - name: Build and smoke-test npm artifact
        run: npm run build --prefix "${{ matrix.package }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.package }}
          path: .artifacts/${{ matrix.package }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  secrets:
    uses: ./.github/workflows/secret-scan.yml

  passed:
    name: CI passed
    if: always()
    needs: [changes, tooling, packages, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            for (const name of ["changes", "tooling", "secrets"]) {
              if (jobs[name].result !== "success") process.exit(1);
            }
            const expected = {
              packages: jobs.changes.outputs.has_packages === "true"
            };
            for (const [name, required] of Object.entries(expected)) {
              if (jobs[name].result !== (required ? "success" : "skipped")) process.exit(1);
            }
          '
